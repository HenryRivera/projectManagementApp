version: '3.8'

# Production docker-compose using images from registry
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub username

services:
  backend:
    image: YOUR_DOCKERHUB_USERNAME/project-management-backend:latest
    container_name: project-management-backend-prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/projects.db
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: YOUR_DOCKERHUB_USERNAME/project-management-frontend:latest
    container_name: project-management-frontend-prod
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: project-management-nginx-prod
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Add SSL certificates here:
      # - ./ssl:/etc/nginx/ssl
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend
      - frontend

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge
