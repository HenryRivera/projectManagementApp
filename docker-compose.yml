version: '3.8'

services:
  backend:
    build: ./backend
    container_name: project-management-backend
    volumes:
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/projects.db
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: project-management-frontend
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: project-management-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge
