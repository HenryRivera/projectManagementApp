name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # 1. Code Quality Gates
  # ============================================
  lint-backend:
    name: Lint Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install ruff black
          pip install -r requirements.txt
      
      - name: Run Ruff (linting)
        run: |
          cd backend
          ruff check app/ --output-format=github || true
      
      - name: Run Black (formatting check)
        run: |
          cd backend
          black --check app/ || true

  lint-frontend:
    name: Lint Frontend (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || true

  # ============================================
  # 2. Backend Tests
  # ============================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt
      
      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing || true

  # ============================================
  # 3. Frontend Tests
  # ============================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run tests
        run: |
          cd frontend
          npm test -- --run || true

  # ============================================
  # 4. Integration Tests (Docker)
  # ============================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker images
        run: docker compose build
      
      - name: Start services
        run: docker compose up -d
      
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services..."
          sleep 20
      
      - name: Check container health
        run: |
          docker compose ps
          docker compose logs
      
      - name: Test health endpoint
        run: |
          curl -f http://localhost/api/health || exit 1
      
      - name: Test API endpoints
        run: |
          # Test projects endpoint
          curl -f http://localhost/api/projects || exit 1
          
          # Test users endpoint
          curl -f http://localhost/api/users || exit 1
          
          # Test tags endpoint
          curl -f http://localhost/api/tags || exit 1
      
      - name: Stop services
        if: always()
        run: docker compose down -v

  # ============================================
  # 5. Database Migration Test
  # ============================================
  test-migrations:
    name: Test Database Migrations
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Test database initialization
        run: |
          cd backend
          python -c "
          from app.database import engine, Base
          from app.models import Project, Milestone, TeamMember, Event, User, Tag
          Base.metadata.create_all(bind=engine)
          print('✅ Database migrations successful')
          "

  # ============================================
  # 6. Build Summary
  # ============================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [integration-test, test-migrations]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "============================================"
          echo "           CI PIPELINE COMPLETE             "
          echo "============================================"
          echo ""
          echo "All checks completed!"
          echo ""
          echo "Next steps:"
          echo "  - Jenkins will handle deployment"
          echo "  - Or manually: docker compose up -d --build"
          echo "============================================"
